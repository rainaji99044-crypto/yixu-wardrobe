 var(--line);border-radius:8px;padding:9px;background:#fff}.checks{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.collage{height:240px;display:grid;grid-template-columns:1fr 1fr;padding:10px}.collage img{width:100%;height:100%;object-fit:contain}.tryon{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.stage{height:430px;border:1px solid var(--line);border-radius:13px;position:relative;background:linear-gradient(45deg,#f4eff3 25%,transparent 25%),linear-gradient(-45deg,#f4eff3 25%,transparent 25%);background-size:20px 20px;overflow:hidden}.person{position:absolute;inset:22px;margin:auto;width:48%;height:88%;opacity:.48}.layer{position:absolute;width:44%;height:34%;object-fit:contain}.l0{left:2%;top:4%}.l1{right:2%;top:28%}.l2{left:2%;bottom:4%}.l3{right:2%;bottom:4%}.picker{max-height:430px;overflow:auto}.picker h3{font-size:13px;color:var(--muted)}.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.minis button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px}.minis button.on{border-color:var(--p);background:var(--soft)}.minis img{width:100%;height:72px;object-fit:contain}.inspo{columns:3;column-gap:15px}.inspo .card{break-inside:avoid;margin-bottom:15px}.inspo .photo{height:auto;aspect-ratio:4/5}.inspo .photo img{object-fit:cover}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:27px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:16px}.panel.wide{grid-column:1/-1}.category-counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.category-count{border:1px solid var(--line);border-radius:9px;padding:12px}.category-count span{display:block;color:var(- @media(max-width:800px){.shell{padding-left:0}.side{display:none}.main{padding:24px 15px 88px}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(4,1fr);z-index:20}.bottom button{text-align:center;font-size:12px;padding:5px}.head{align-items:flex-start;flex-wrap:wrap}.head .btn{flex:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.category-section{padding:13px}.category-rail{margin-right:-13px;padding-right:13px}.category-rail .card{flex-basis:155px}.category-rail .photo{height:150px}.photo{height:165px}.form,.tryon,.panels{grid-template-columns:1fr}.outfits{grid-template-columns:1fr}.stage{height:350px}.metrics{grid-template-columns:1fr 1fr}.category-counts{grid-template-columns:repeat(3,minmax(0,1fr))}.calendar-grid{gap:4px}.calendar-blank,.calendar-day{min-height:68px}.calendar-day{padding:5px}.day-look img{height:42px}.look-choices{grid-template-columns:repeat(2,minmax(0,1fr))}.inspo{columns:2}.picker{max-height:330px}}@media(max-width:430px){.inspo{columns:1}.minis{grid-template-columns:repeat(2,1fr)}.category-counts{grid-template-columns:repeat(2,minmax(0,1fr))}.weekday{font-size:10px}.calendar-day>span{font-size:10px}.calendar-day>small{font-size:15px}}

<body><div class="shell"><aside class="side"><div class="brand"><span class="mark"><img src="./app-icon-v2.svg" alt="衣架图标"></span><span><b>衣序</b><small>YIXU WARDROBE</small></span></div><nav class="nav" id="sideNav"></nav></aside><main class="main" id="app"></main><nav class="bottom" id="bottomNav"></nav></div><div id="overlay"></div><script>
const CATS=['上衣','裤装','半身裙','连衣裙','外套','鞋履','包袋','配饰','其他'],SEAS=['春季','夏季','秋季','冬季'],STYLES=['简约','通勤','休闲','优雅','复古','运动','甜美','中性'],THICK=['轻薄','适中','厚实'];
let page='closet',items=[],outfits=[],inspirations=[],dailyLooks=[],season='',style='',query='',draft=null,selected=[],calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);const app=document.querySelector('#app'),overlay=document.querySelector('#overlay');
function db(){return new Promise((ok,no)=>{const q=indexedDB.open('yixu-standalone',2);q.onupgradeneeded=()=>['items','outfits','inspirations','dailyLooks'].forEach(s=>q.result.objectStoreNames.contains(s)||q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function all(store){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function put(store,value){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(store,'readwrite').objectStore(store).put(value);q.onsuccess=ok;q.onerror=()=>no(q.error)})}async function del(store,id){const d=await db();return new Promise(ok=>{const q=d.transaction(store,'readwrite').objectStore(store).delete(id);q.onsuccess=ok})}
async function load(){[items,outfits,inspirations,dailyLooks]=await Promise.all([all('items'),all('outfits'),all('inspirations'),all('dailyLooks')]);render()}
const nav=[['closet','衣橱'],['outfits','穿搭'],['inspiration','灵感'],['dashboard','看板']];function navs(){for(const id of ['sideNav','bottomNav'])document.querySelector('#'+id).innerHTML=nav.map(([k,v])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){page=p;navs();render()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function url(blob){return URL.createObjectURL(blob)}function toast(s){const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),1800)}
function head(en,title,copy,action=''){return `<div class="head"><div><span class="eyebrow">${en}</span><h1>${title}</h1><p>${copy}</p></div>${action}</div>`}
function render(){navs();if(page==='closet')closet();if(page==='outfits')outfitPage();if(page==='inspiration')inspoPage();if(page==='dashboard')dashboard()}
function itemCard(x){return `<article class="card"><div class="photo"><img src="${url(x.image)}"></div><div class="body"><b>${esc(x.category)}</b><small>${esc(x.color)} · ${esc(x.seasons.join(' / ')||'未设季节')}</small><small>${esc(x.styles.join(' / ')||'未设风格')}</small><button class="danger" onclick="removeItem('${x.id}')">删除</button></div></article>`}
function closet(){const result=items.filter(x=>(!query||[x.name,x.category,...x.styles].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!season||x.seasons.includes(season))&&(!style||x.styles.includes(style))),groups=CATS.map(category=>({category,list:result.filter(x=>x.category===category)})).filter(x=>x.list.length);app.innerHTML=head('WARDROBE','我的衣橱','照片优先录入，资料自动识别后可调整。','<button class="btn primary" onclick="addItem()">＋ 添加衣物</button>')+`<section class="filters"><input class="search" placeholder="搜索名称或风格" value="${esc(query)}" oninput="query=this.value;closet()"><div class="filter"><span>季节</span>${['',...SEAS].map(x=>`<button class="chip ${season===x?'on':''}" onclick="season='${x}';closet()">${x||'全部'}</button>`).join('')}</div><div class="filter"><span>风格</span>${['',...STYLES].map(x=>`<button class="chip ${style===x?'on':''}" onclick="style='${x}';closet()">${x||'全部'}</button>`).join('')}</div></section>`+(groups.length?`<div class="closet-groups">${groups.map(g=>`<section class="category-section"><div class="category-head"><h2>${esc(g.category)}</h2><span>${g.list.length} 件 · 左右滑动</span></div><div class="category-rail" aria-label="${esc(g.category)}衣物">${g.list.map(itemCard).join('')}</div></section>`).join('')}</div>`:`<div class="empty"><div><h3>还没有符合条件的衣物</h3><p>拍照或从相册选择第一件衣物。</p><button class="btn primary" onclick="addItem()">添加衣物</button></div></div>`)}
function addItem(){draft={category:'',color:'',seasons:[],styles:[],thickness:'',brand:'',price:'',purchaseDate:'',notes:'',image:null};itemModal()}
function itemModal(){overlay.innerHTML=`<div class="modal"><section class="dialog"><button class="close" onclick="closeModal()">×</button><h2>添加衣物</h2><p>纯色背景会在本机自动透明化；背景复杂时保留原图，避免损伤衣物。</p><div class="upload">${draft.image?`<div class="preview"><img src="${url(draft.image)}"></div>`:'<div class="preview" style="display:grid;place-items:center">添加衣物照片 *</div>'}<div class="upload-actions"><label class="btn">从相册选择<input hidden type="file" accept="image/*" onchange="pickPhoto(this.files[0])"></label><label class="btn">拍照<input hidden type="file" accept="image/*" capture="environment" onchange="pickPhoto(this.files[0])"></label></div></div><div class="form"><label>分类<select onchange="draft.category=this.value">${opts(CATS,draft.category)}</select></label><label>颜色<input value="${esc(draft.color)}" onchange="draft.color=this.value"></label><label>薄厚<select onchange="draft.thickness=this.value">${opts(THICK,draft.thickness)}</select></label><label>风格<select onchange="draft.styles=this.value?[this.value]:[]">${opts(STYLES,draft.styles[0])}</select></label><label>品牌<input value="${esc(draft.brand)}" onchange="draft.brand=this.value"></label><label>购买价格<input type="number" min="0" value="${draft.price}" onchange="draft.price=this.value"></label><label>购买日期<input type="date" value="${draft.purchaseDate}" onchange="draft.purchaseDate=this.value"></label></div><div class="checks">${SEAS.map(s=>`<label><input type="checkbox" ${draft.seasons.includes(s)?'checked':''} onchange="this.checked?draft.seasons.push('${s}'):draft.seasons=draft.seasons.filter(x=>x!=='${s}')">${s}</label>`).join('')}</div><label class="full">备注<textarea onchange="draft.notes=this.value">${esc(draft.notes)}</textarea></label><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveItem()">保存衣物</button></div></section></div>`}
function opts(arr,value){return '<option value="">请选择</option>'+arr.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}
async function pickPhoto(file){if(!file)return;toast('正在本机处理照片…');const out=await processImage(file);Object.assign(draft,out.tags,{image:out.image,name:out.tags.color+out.tags.category});itemModal();toast(out.cutoutApplied?'已完成透明化和基础识别':'背景较复杂，已保留原图并完成基础识别')}
async function processImage(file){const bm=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*scale));c.height=Math.max(1,Math.round(bm.height*scale));const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bm,0,0,c.width,c.height);bm.close();const d=x.getImageData(0,0,c.width,c.height),p=d.data,w=c.width,h=c.height,original=new Uint8ClampedArray(p),step=Math.max(1,Math.floor(Math.min(w,h)/80)),samples=[];for(let xx=0;xx<w;xx+=step){samples.push([p[xx*4],p[xx*4+1],p[xx*4+2]]);let i=((h-1)*w+xx)*4;samples.push([p[i],p[i+1],p[i+2]])}for(let yy=0;yy<h;yy+=step){let i=yy*w*4;samples.push([p[i],p[i+1],p[i+2]]);i=(yy*w+w-1)*4;samples.push([p[i],p[i+1],p[i+2]])}const bg=[0,1,2].map(k=>samples.reduce((sum,v)=>sum+v[k],0)/samples.length),spread=Math.sqrt(samples.reduce((sum,v)=>sum+Math.pow(v[0]-bg[0],2)+Math.pow(v[1]-bg[1],2)+Math.pow(v[2]-bg[2],2),0)/samples.length),threshold=Math.max(22,Math.min(48,18+spread*.9));let cutoutApplied=false;if(spread<32){const seen=new Uint8Array(w*h),queue=new Int32Array(w*h);let head=0,tail=0,removed=0;const add=(xx,yy)=>{const pos=yy*w+xx;if(seen[pos])return;const i=pos*4,dist=Math.hypot(p[i]-bg[0],p[i+1]-bg[1],p[i+2]-bg[2]);if(dist<=threshold){seen[pos]=1;queue[tail++]=pos}};for(let xx=0;xx<w;xx++){add(xx,0);add(xx,h-1)}for(let yy=0;yy<h;yy++){add(0,yy);add(w-1,yy)}while(head<tail){const pos=queue[head++],xx=pos%w,yy=(pos/w)|0;removed++;if(xx>0)add(xx-1,yy);if(xx<w-1)add(xx+1,yy);if(yy>0)add(xx,yy-1);if(yy<h-1)add(xx,yy+1)}const ratio=removed/(w*h);if(ratio>=.08&&ratio<=.9){cutoutApplied=true;for(let pos=0;pos<seen.length;pos++)if(seen[pos]){const i=pos*4,dist=Math.hypot(p[i]-bg[0],p[i+1]-bg[1],p[i+2]-bg[2]),edge=threshold*.72;p[i+3]=dist<=edge?0:Math.round(255*(dist-edge)/(threshold-edge))}}}if(!cutoutApplied)p.set(original);x.putImageData(d,0,0);let R=0,G=0,B=0,n=0,minX=w,maxX=0,minY=h,maxY=0;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const i=(yy*w+xx)*4;if(p[i+3]>90){R+=p[i];G+=p[i+1];B+=p[i+2];n++;minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,yy);maxY=Math.max(maxY,yy)}}R/=Math.max(1,n);G/=Math.max(1,n);B/=Math.max(1,n);const colors=[['黑色',30,30,30],['白色',235,235,235],['灰色',135,135,135],['米色',210,195,165],['棕色',115,74,48],['红色',180,55,58],['粉色',220,145,165],['绿色',70,130,85],['蓝色',65,105,170],['紫色',120,80,145]];let color=colors.sort((a,b)=>Math.hypot(R-a[1],G-a[2],B-a[3])-Math.hypot(R-b[1],G-b[2],B-b[3]))[0][0],ratio=(maxX-minX)/Math.max(1,maxY-minY),category=ratio>1.35?'配饰':ratio<.42?'裤装':'上衣',thickness=category==='外套'?'厚实':category.includes('裙')?'轻薄':'适中',seasons=thickness==='厚实'?['秋季','冬季']:thickness==='轻薄'?['春季','夏季']:['春季','秋季'],styles=[(R+G+B)/3>185?'简约':(R+G+B)/3<80?'通勤':'休闲'];const image=await new Promise(ok=>c.toBlob(ok,'image/png'));return{image,cutoutApplied,tags:{category,color,thickness,seasons,styles}}}
async function saveItem(){if(!draft.image)return toast('请先添加照片');if(!draft.category)return toast('请选择分类');draft.id=crypto.randomUUID();draft.createdAt=new Date().toISOString();draft.price=draft.price?Number(draft.price):null;await put('items',draft);closeModal();await load();toast('衣物已保存')}
async function removeItem(id){if(!confirm('确定删除这件衣物吗？'))return;await del('items',id);await load()}
function closeModal(){overlay.innerHTML=''}
function outfitPage(){app.innerHTML=head('OUTFITS','穿搭试衣间','从衣橱挑选单品，在虚拟小人上组合预览。','<button class="btn primary" onclick="openTryon()">＋ 创建穿搭</button>')+(outfits.length?`<div class="outfits">${outfits.map(o=>`<article class="card"><div class="collage">${o.itemIds.map(id=>{const x=items.find(i=>i.id===id);return x?`<img src="${url(x.image)}">`:''}).join('')}</div><div class="body"><b>${o.itemIds.length} 件单品</b><button class="danger" onclick="removeOutfit('${o.id}')">删除</button></div></article>`).join('')}</div>`:'<div class="empty"><div><h3>还没有穿搭方案</h3><button class="btn primary" onclick="openTryon()">开始搭配</button></div></div>')}
function openTryon(){selected=[];tryonModal()}function group(cat){return ['上衣'].includes(cat)?'上装':['裤装','半身裙','连衣裙'].includes(cat)?'下装':cat==='外套'?'外套':'鞋包配饰'}function choose(id){const item=items.find(x=>x.id===id),g=group(item.category);selected=selected.filter(x=>group(items.find(i=>i.id===x).category)!==g);selected.push(id);tryonModal()}
function tryonModal(){const chosen=selected.map(id=>items.find(x=>x.id===id));overlay.innerHTML=`<div class="modal"><section class="dialog"><button class="close" onclick="closeModal()">×</button><h2>虚拟试衣</h2><div class="tryon"><div class="stage"><svg class="person" viewBox="0 0 100 260"><circle cx="50" cy="27" r="22" fill="#bdaab7"/><path d="M28 55 Q50 44 72 55 L83 145 68 155 72 253 53 253 50 167 47 253 28 253 32 155 17 145Z" fill="#bdaab7"/></svg>${chosen.map((x,i)=>`<img class="layer l${i}" src="${url(x.image)}">`).join('')}</div><div class="picker">${['上装','下装','外套','鞋包配饰'].map(g=>`<h3>${g}</h3><div class="minis">${items.filter(x=>group(x.category)===g).map(x=>`<button class="${selected.includes(x.id)?'on':''}" onclick="choose('${x.id}')"><img src="${url(x.image)}"><small>${x.category}</small></button>`).join('')}</div>`).join('')}</div></div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveOutfit()">保存方案</button></div></section></div>`}
async function saveOutfit(){if(!selected.length)return toast('请先选择衣物');await put('outfits',{id:crypto.randomUUID(),itemIds:[...selected],createdAt:new Date().toISOString()});closeModal();await load();toast('穿搭已保存')}async function removeOutfit(id){await del('outfits',id);await load()}
function inspoPage(){app.innerHTML=head('INSPIRATION','收藏灵感','收藏每一次心动，慢慢建立属于自己的审美坐标。','<button class="btn primary" onclick="inspoModal()">＋ 上传灵感</button>')+(inspirations.length?`<div class="inspo">${inspirations.map(x=>`<article class="card"><div class="photo"><img src="${url(x.image)}"></div><div class="body">${x.brand?`<small>品牌：${esc(x.brand)}</small>`:''}${x.price?`<small>价格：¥${x.price}</small>`:''}${x.wanted?`<small>想买：${esc(x.wanted)}</small>`:''}<button class="danger" onclick="removeInspo('${x.id}')">删除</button></div></article>`).join('')}</div>`:'<div class="empty"><div><h3>还没有收藏灵感</h3><button class="btn primary" onclick="inspoModal()">上传图片</button></div></div>')}
function inspoModal(reset=true){if(reset)draft={image:null,brand:'',price:'',wanted:''};overlay.innerHTML=`<div class="modal"><section class="dialog"><button class="close" onclick="closeModal()">×</button><h2>上传穿搭参考</h2><p>保存喜欢的穿搭图片，记录可选的品牌、价格和想买单品。</p><div class="upload">${draft.image?`<div class="preview"><img src="${url(draft.image)}"></div>`:'<div class="preview" style="display:grid;place-items:center">选择穿搭图片 *</div>'}<div class="upload-actions"><label class="btn">从相册选择<input hidden type="file" accept="image/*" onchange="pickInspiration(this.files[0])"></label><label class="btn">拍照<input hidden type="file" accept="image/*" capture="environment" onchange="pickInspiration(this.files[0])"></label></div></div><div class="form"><label>品牌（选填）<input value="${esc(draft.brand)}" oninput="draft.brand=this.value"></label><label>价格（选填）<input type="number" min="0" value="${esc(draft.price)}" oninput="draft.price=this.value"></label></div><label class="full">想买的单品（选填）<input value="${esc(draft.wanted)}" oninput="draft.wanted=this.value"></label><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveInspo()">收藏</button></div></section></div>`}
function pickInspiration(file){if(!file)return;draft.image=file;inspoModal(false);toast('图片已选择')}
async function saveInspo(){if(!draft.image)return toast('请先选择图片');await put('inspirations',{...draft,id:crypto.randomUUID(),price:draft.price?Number(draft.price):null,createdAt:new Date().toISOString()});closeModal();await load()}async function removeInspo(id){await del('inspirations',id);await load()}
function dateKey(year,month,day){return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function changeCalendar(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);dashboard()}
function outfitImages(outfit,limit=3){return outfit.itemIds.slice(0,limit).map(id=>{const item=items.find(x=>x.id===id);return item?`<img src="${url(item.image)}" alt="${esc(item.category)}">`:''}).join('')}
function dashboard(){const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),monthPrefix=`${year}-${String(month+1).padStart(2,'0')}`,monthChecks=dailyLooks.filter(x=>x.date.startsWith(monthPrefix)).length,first=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),counts=CATS.map(category=>({category,count:items.filter(x=>x.category===category).length})),cells=Array.from({length:first},()=>'<span class="calendar-blank"></span>').concat(Array.from({length:days},(_,i)=>{const day=i+1,date=dateKey(year,month,day),record=dailyLooks.find(x=>x.date===date),outfit=record&&outfits.find(x=>x.id===record.outfitId);return `<button class="calendar-day ${outfit?'has-look':''}" onclick="dailyLookModal('${date}')"><span>${day}</span>${outfit?`<div class="day-look">${outfitImages(outfit)}</div>`:'<small>＋</small>'}</button>`}));app.innerHTML=head('OUTFIT CALENDAR','穿搭日历','记录每天真正穿过的搭配，让衣橱被更好地使用。')+`<div class="metrics"><div class="metric"><span>衣物</span><strong>${items.length}</strong></div><div class="metric"><span>穿搭方案</span><strong>${outfits.length}</strong></div><div class="metric"><span>本月打卡</span><strong>${monthChecks}</strong></div><div class="metric"><span>灵感</span><strong>${inspirations.length}</strong></div></div><div class="panels"><section class="panel wide"><h2>衣物分类数量</h2><div class="category-counts">${counts.map(x=>`<div class="category-count"><span>${x.category}</span><strong>${x.count}</strong></div>`).join('')}</div></section><section class="panel wide"><div class="calendar-nav"><button class="btn" onclick="changeCalendar(-1)" aria-label="上个月">‹</button><h2>${year} 年 ${month+1} 月</h2><button class="btn" onclick="changeCalendar(1)" aria-label="下个月">›</button></div><div class="calendar-grid"><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div><div class="weekday">日</div>${cells.join('')}</div></section></div>`}
function dailyLookModal(date){const current=dailyLooks.find(x=>x.date===date),content=outfits.length?`<div class="look-choices">${outfits.map((o,i)=>`<button class="look-choice ${current&&current.outfitId===o.id?'on':''}" onclick="saveDailyLook('${date}','${o.id}')"><div class="collage">${outfitImages(o,4)}</div><b>穿搭 ${i+1}</b></button>`).join('')}</div>`:`<div class="empty"><div><h3>还没有穿搭方案</h3><p>先去穿搭页保存一套搭配。</p><button class="btn primary" onclick="closeModal();go('outfits')">创建穿搭</button></div></div>`;overlay.innerHTML=`<div class="modal"><section class="dialog"><button class="close" onclick="closeModal()">×</button><h2>${date} 每日穿搭</h2><p>选择一套已经保存的穿搭方案。</p>${content}<div class="actions">${current?`<button class="danger" onclick="removeDailyLook('${date}')">清除当天记录</button>`:''}<button class="btn" onclick="closeModal()">取消</button></div></section></div>`}
async function saveDailyLook(date,outfitId){await put('dailyLooks',{id:date,date,outfitId,updatedAt:new Date().toISOString()});closeModal();await load();toast('每日穿搭已记录')}
async function removeDailyLook(date){await del('dailyLooks',date);closeModal();await load();toast('当天记录已清除')}
load().catch(e=>{app.innerHTML='<div class="empty"><div><h3>无法打开本地数据</h3><p>'+esc(e.message)+'</p></div></div>'});
</script></body></html>
